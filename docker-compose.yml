# Production stack for the Hostinger VPS: PostgreSQL + the FastAPI backend
# + Caddy (serves the built Flutter web app as static files).
#
# HTTPS/reverse-proxying is NOT handled here. This VPS already runs one
# shared Traefik instance (/docker/traefik, network_mode: host, Docker
# provider, cert resolver "letsencrypt") that owns host ports 80/443 for
# every project on the box - see docs/decisions/0006-production-deployment.md.
# `backend` and `caddy` below are discovered by Traefik via docker labels
# and reached directly on their private compose-network IPs (Traefik's
# host networking can already route to any container's bridge IP, so no
# shared Docker network needs to be joined). Neither service publishes a
# port to the host - do not add one, it would fight Traefik for 80/443
# exactly like an in-container Caddy/Nginx with its own ACME would.
#
# Local dev does NOT use this file - it runs the backend directly with `uv
# run uvicorn` against SQLite (see backend/README.md). This is Phase 4
# (CLAUDE.md section 8) production deployment only.
#
# Usage on the VPS:
#   cp .env.production.example .env.production
#   # edit .env.production with real values (see comments in that file)
#   docker compose --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host - only the backend container talks to
    # Postgres, over the private compose network. Nothing external can
    # reach the database directly.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wattledger-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.wattledger-api.entrypoints=websecure"
      - "traefik.http.routers.wattledger-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.wattledger-api.loadbalancer.server.port=8000"
    # Not published to the host - Traefik reaches it directly on the
    # compose network via the labels above.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/build/web:/srv/web:ro # the built Flutter web app - see README
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wattledger-web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.wattledger-web.entrypoints=websecure"
      - "traefik.http.routers.wattledger-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.wattledger-web.loadbalancer.server.port=80"
    # Static file server only - no TLS/ACME of its own and no host port.
    # Traefik terminates HTTPS for wattledger.aiwithbala.in and forwards
    # here in plain HTTP.

volumes:
  postgres_data:
